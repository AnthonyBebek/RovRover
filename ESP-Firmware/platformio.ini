[env:lolin_s2_mini]
lib_deps = 
    robtillaart/AS5600@^0.6.7
platform = espressif32
board = lolin_s2_mini
framework = arduino
upload_port = /dev/serial/by-id/usb-Espressif_ESP32-S2_0-if00
monitor_port = /dev/serial/by-id/usb-Espressif_ESP32-S2_0-if00
upload_speed = 115200
upload_flags =
    --before
    no_reset
    --after
    no_reset
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_flags = --echo
